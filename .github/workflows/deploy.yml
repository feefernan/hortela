name: Deploy

# Merge na main = deploy em produção via FTP na hospedagem Locaweb, servida em usehortela.art.br (Cloudflare na frente).
# Segredos necessários (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   e, opcional, a variável FTP_SERVER_DIR (padrão "./").
# Variáveis de build (VITE_*) ficam em Secrets com o mesmo nome — ver .env.example.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://usehortela.art.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_ORDERS_API: ${{ vars.VITE_ORDERS_API }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_OTEL_EXPORTER_URL: ${{ vars.VITE_OTEL_EXPORTER_URL }}
          VITE_RELEASE: ${{ github.sha }}
      - name: Verificar segredos de FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::FTP_SERVER não configurado — build gerado, deploy pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar via FTP
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false

  worker:
    name: Worker de pedidos (Cloudflare)
    # Publica a API de pedidos. Precisa dos secrets CLOUDFLARE_API_TOKEN e NOTION_TOKEN (sem eles o job
    # avisa e pula) e de MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET e MELHOR_ENVIO_TOKEN (vazios = sem cobrança/frete).
    # Roda antes do site, que depende dela.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - name: Verificar credenciais
        id: cred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ou NOTION_TOKEN ausente — Worker não publicado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cred.outputs.ready == 'true'
        run: npm ci
      - if: steps.cred.outputs.ready == 'true'
        run: npx cf build
      - name: Publicar
        if: steps.cred.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          MELHOR_ENVIO_TOKEN: ${{ secrets.MELHOR_ENVIO_TOKEN }}
        run: |
          umask 077
          node -e 'const e = process.env; require("fs").writeFileSync(e.RUNNER_TEMP + "/secrets.json", JSON.stringify(Object.fromEntries(["NOTION_TOKEN", "MP_ACCESS_TOKEN", "MP_WEBHOOK_SECRET", "MELHOR_ENVIO_TOKEN"].map((k) => [k, e[k] ?? ""]))))'
          npx cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/secrets.json" --message "${{ github.sha }}"
          rm -f "$RUNNER_TEMP/secrets.json"
